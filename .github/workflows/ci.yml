name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - run: uv run python -m unittest discover -s tests -t . -v -b
      - run: uv run bean-check tests/fixtures/budget.bean

  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Inspect distribution contents
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "fava_budget/Budget.js",
              "fava_budget/templates/Budget.html",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Wheel is missing package data: {sorted(missing)}")
          if not any(name.endswith(".dist-info/licenses/LICENSE") for name in names):
              raise SystemExit("Wheel is missing the MIT LICENSE file")

          sdist = next(Path("dist").glob("*.tar.gz"))
          root = sdist.name.removesuffix(".tar.gz")
          with open_tar(sdist) as archive:
              names = set(archive.getnames())

          required = {
              f"{root}/Dockerfile",
              f"{root}/LICENSE",
              f"{root}/docs/images/budget-overview.png",
              f"{root}/docs/images/unbudgeted-suggestions.png",
              f"{root}/tests/fixtures/budget.bean",
              f"{root}/tests/test_fava_budget.py",
              f"{root}/tests/test_package_data.py",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Source distribution is missing files: {sorted(missing)}")
          print(f"Verified package data in {wheel} and repository assets in {sdist}")
          PY

  docker:
    name: Clean wheel smoke test on Python ${{ matrix.python-version }}
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          --target test
          --tag fava-budget:test-${{ matrix.python-version }}
          .
