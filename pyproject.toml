[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fava-budget"
version = "0.1.1"
description = "A focused monthly budgeting extension for Fava"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Colin Seymour" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fava>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "ruff>=0.13",
  "twine>=6.2",
]

[project.urls]
Homepage = "https://github.com/lildude/fava-budget"
Issues = "https://github.com/lildude/fava-budget/issues"
Repository = "https://github.com/lildude/fava-budget"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fava_budget = [
  "Budget.js",
  "templates/*.html",
]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
